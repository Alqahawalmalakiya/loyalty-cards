<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 5px 20px rgba(0,0,0,.1);
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      background: #111;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>بطاقات العملاء المميزين</h2>
  <p>تسجيل دخول الإدارة</p>

  <input id="email" type="email" placeholder="الإيميل">

  <input id="password" type="password" placeholder="كلمة المرور">

  <button onclick="login()">دخول</button>

  <div id="result"></div>

</div>

<script>

const SUPABASE_URL =
  "https://qqssbpvtgrcjvpxtjoex.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YVAtP98AkFDl4DbyWs5YpQ_aAEVkmGo";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const result =
    document.getElementById("result");

  result.textContent = "جاري تسجيل الدخول...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    result.textContent =
      "❌ " + error.message;

    return;
  }

result.innerHTML = `
  <h3>✅ تم تسجيل الدخول بنجاح</h3>
  <p>أهلًا بك في لوحة الإدارة</p>
  <button onclick="location.reload()">دخول للوحة التحكم</button>
`;

}

</script>

</body>
</html>
